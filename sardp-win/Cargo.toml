[package]
name = "sardp-win"
version = "0.1.0"
edition = "2024"
description = "Windows OS integration for SARDP (Stage 3): DXGI desktop capture + Media Foundation H.264 hardware encode behind a safe API"

# This crate is where the inherently-unsafe Win32/COM code lives; the core
# `sardp` crate keeps `unsafe_code = "forbid"` and only calls the safe API
# exported here.

[dependencies]
dxgi-capture-poc = { path = "../tools/dxgi-capture-poc" }
tokio = { version = "1.53.1", features = ["sync"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
