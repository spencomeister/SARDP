[package]
name = "dxgi-capture-poc"
version = "0.1.0"
edition = "2024"

[dependencies]
# `sardp::drop_guard::DropGuard` (KNOWN_ISSUES #29): the only piece of the
# core crate this Windows-only PoC crate needs.
sardp = { path = "../.." }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
