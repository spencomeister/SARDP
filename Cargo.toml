[workspace]
members = ["sardp-cli", "sardp-win", "tools/dxgi-capture-poc", "tools/sck-capture-poc"]
# What a bare `cargo build`/`cargo test` at the root covers: the core crate
# and the binaries. The Windows-only crates are built explicitly (or via
# `--workspace` on Windows) so a Linux checkout still builds and tests.
default-members = [".", "sardp-cli"]
# fuzz/ is its own standalone cargo-fuzz workspace (depends on this crate
# via a path dependency, deliberately kept outside the normal build graph
# so libfuzzer-sys doesn't leak into ordinary `cargo build`/`cargo test`).
exclude = ["fuzz"]

[package]
name = "sardp"
version = "0.1.0"
edition = "2024"

[dependencies]
ciborium = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.9"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
