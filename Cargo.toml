[workspace]
members = ["tools/dxgi-capture-poc", "sardp-win"]
# fuzz/ is its own standalone cargo-fuzz workspace (depends on this crate
# via a path dependency, deliberately kept outside the normal build graph
# so libfuzzer-sys doesn't leak into ordinary `cargo build`/`cargo test`).
exclude = ["fuzz"]

[package]
name = "sardp"
version = "0.1.0"
edition = "2024"

[dependencies]
ciborium = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.9"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync", "time"] }

# Real desktop capture + hardware encode (Stage 3, 3W-1-d). Windows-only;
# the crate wraps all the unsafe COM/FFI so this crate's `forbid` stays.
[target.'cfg(windows)'.dependencies]
sardp-win = { path = "sardp-win" }

[lints.rust]
unsafe_code = "forbid"
